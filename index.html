                <h3>Типичные ошибки</h3>
                ${element.content.errors.map(err => `<div class="error-box">${err}</div>`).join('')}
                <button class="close-btn" onclick="closeCard(${element.id})">Понял!</button>`;
            
            modal.style.display = 'block';
            visitedElements.add(element.id);
            const elBtn = document.getElementById(`element-${element.id}`);
            if (elBtn) elBtn.classList.add('visited');
            updateProgress();
        }

        function closeCard(elementId) {
            document.getElementById('modal').style.display = 'none';
            checkTestAvailability();
        }

        function updateProgress() {
            const progress = visitedElements.size;
            const total = elements.length;
            document.getElementById('progress-text').textContent = `${progress}/${total}`;
            document.getElementById('progress-fill').style.width = `${(progress / total) * 100}%`;
        }

        function checkTestAvailability() {
            if (visitedElements.size === elements.length) {
                document.getElementById('test-btn').disabled = false;
            }
        }

        document.getElementById('test-btn').onclick = function() {
            document.getElementById('elements-grid').style.display = 'none';
            document.querySelector('.test-btn-container').style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            document.getElementById('test-container').style.display = 'block';
            document.getElementById('timer').style.display = 'block';
            startTimer();
            renderTest();
        };

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('timer-value').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function renderTest() {
            const container = document.getElementById('test-container');
            container.innerHTML = '<h2 style="font-family: Playfair Display; color: #5c3a21; margin-bottom: 35px; text-align: center; font-size: 2.4rem; border-bottom: 3px solid #c9a96e; padding-bottom: 15px; font-style: italic;">Тест: Барокко в Англии и Франции</h2>';
            testQuestions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `
                    <div class="question-text"><strong>Вопрос ${index + 1}:</strong> ${q.question}</div>
                    <div class="answers">
                        ${q.answers.map((ans, ansIndex) => `<div class="answer-option" onclick="selectAnswer(${index}, ${ansIndex})">${ans}</div>`).join('')}
                    </div>
                    <button class="hint-btn" onclick="showHint(${index})">Подсказка</button>
                    <div class="hint-text" id="hint-${index}">${q.hint}</div>`;
                container.appendChild(questionDiv);
            });
            const submitBtn = document.createElement('button');
            submitBtn.className = 'submit-test-btn';
            submitBtn.textContent = 'Проверить ответы';
            submitBtn.onclick = checkAnswers;
            container.appendChild(submitBtn);
        }

        function selectAnswer(questionIndex, answerIndex) {
            const question = document.querySelectorAll('.question')[questionIndex];
            const options = question.querySelectorAll('.answer-option');
            options.forEach(opt => opt.classList.remove('selected'));
            options[answerIndex].classList.add('selected');
            options[answerIndex].dataset.selected = 'true';
        }

        function showHint(index) { document.getElementById(`hint-${index}`).style.display = 'block'; }

        function checkAnswers() {
            clearInterval(timerInterval);
            let correct = 0;
            const total = testQuestions.length;
            let mistakesHtml = '';

            testQuestions.forEach((q, index) => {
                const question = document.querySelectorAll('.question')[index];
                const options = question.querySelectorAll('.answer-option');
                let selected = -1;

                options.forEach((opt, optIndex) => {
                    if (opt.dataset.selected === 'true') selected = optIndex;
                    opt.onclick = null;
                });

                if (selected === q.correct) {
                    correct++;
                    options[selected].classList.add('correct');
                } else {
                    if (selected !== -1) options[selected].classList.add('incorrect');
                    options[q.correct].classList.add('correct');
                    
                    const userAnswer = selected !== -1 ? q.answers[selected] : "Ответ не выбран";
                    const rightAnswer = q.answers[q.correct];
                    mistakesHtml += `
                        <div style="margin-bottom: 15px; padding: 15px; background: rgba(255, 249, 240, 0.8); border-left: 4px solid #cd5c5c; border-radius: 8px; text-align: left;">
                            <p style="font-weight: 600; margin-bottom: 8px; color: #3a2a1a;">Вопрос ${index + 1}: ${q.question}</p>
                            <p style="color: #cd5c5c; margin-bottom: 4px;">❌ Ваш ответ: ${userAnswer}</p>
                            <p style="color: #6b8e23; font-weight: 600;">✅ Правильный ответ: ${rightAnswer}</p>
                        </div>`;
                }
            });

            setTimeout(() => showResults(correct, total, mistakesHtml), 1500);
        }

        function showResults(correct, total, mistakesHtml) {
            document.getElementById('test-container').style.display = 'none';
            document.getElementById('timer').style.display = 'none';
            const results = document.getElementById('results');
            results.style.display = 'block';

            let mistakesSection = '';
            if (correct < total) {
                mistakesSection = `
                    <div style="margin-top: 30px; text-align: left; max-width: 800px; margin-left: auto; margin-right: auto;">
                        <h3 style="font-family: 'Playfair Display', serif; color: #cd5c5c; font-size: 1.5rem; margin-bottom: 15px; text-align: center;">Разбор ошибок:</h3>
                        ${mistakesHtml}
                    </div>`;
            } else {
                mistakesSection = `
                    <div style="margin-top: 20px; padding: 15px; background: rgba(107, 142, 35, 0.1); border-radius: 10px; color: #6b8e23; font-weight: 600;">
                        🎉 Ошибок нет! Идеальный результат!
                    </div>`;
            }

            if (correct === total) {
                results.className = 'results success';
                results.innerHTML = `
                    <h2>Отлично!</h2>
                    <p>Ты настоящий знаток барокко!</p>
                    <p>Правильных ответов: ${correct} из ${total}</p>
                    ${mistakesSection}
                    <button class="restart-btn" onclick="restart()" style="margin-top: 25px;">Вернуться к карточкам</button>`;
                createConfetti();
            } else {
                results.className = 'results failure';
                results.innerHTML = `
                    <h2>Почти получилось!</h2>
                    <p>Правильных ответов: ${correct} из ${total}</p>
                    ${mistakesSection}
                    <button class="restart-btn" onclick="restart()" style="margin-top: 25px;">Вернуться к карточкам</button>
                    <button class="restart-btn" onclick="retakeTest()">Пройти тест снова</button>`;
            }
        }

        function createConfetti() {
            const colors = ['#c9a96e', '#a07840', '#6b8e23', '#cd853f', '#8b7355'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }

        function restart() {
            visitedElements.clear();
            seconds = 0;
            document.getElementById('results').style.display = 'none';
            document.getElementById('elements-grid').style.display = 'grid';
            document.querySelector('.test-btn-container').style.display = 'block';
            document.querySelector('.progress-container').style.display = 'block';
            document.getElementById('test-btn').disabled = true;
            renderElements();
            updateProgress();
        }

        function retakeTest() {
            seconds = 0;
            document.getElementById('results').style.display = 'none';
            document.getElementById('test-container').style.display = 'block';
            document.getElementById('timer').style.display = 'block';
            startTimer();
            renderTest();
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById('modal')) {
                document.getElementById('modal').style.display = 'none';
            }
        }

        init();
    </script>
</body>
</html>
